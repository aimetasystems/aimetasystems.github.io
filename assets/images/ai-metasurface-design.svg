    <rect x="77" y="73" width="14" height="42" transform="rotate(120 84 94)"/>
    <rect x="133" y="76" width="18" height="36" transform="rotate(150 142 94)"/>
    <rect x="19" y="129" width="12" height="42" transform="rotate(30 25 150)"/>
    <rect x="76" y="131" width="16" height="38" transform="rotate(60 84 150)"/>
    <rect x="135" y="128" width="14" height="44" transform="rotate(90 142 150)"/>
